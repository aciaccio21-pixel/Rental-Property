databases:
  - name: rental-steward-db
    databaseName: rental_steward
    user: rental_steward
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: rental-steward
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    preDeployCommand: pnpm run db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rental-steward-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_DISPLAY_NAME
        sync: false
